<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <script async defer data-domain="wickeditor.com" src="https://plausible.io/js/plausible.hash.js"></script>
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">

    <!-- Wick Editor Dependencies: -->
    <!-- Wick Engine -->
    <script src="%PUBLIC_URL%/corelibs/wick-engine/wickengine.js"></script>
    <!-- GIF Import/Export -->
    <script src="%PUBLIC_URL%/corelibs/gif/gif.js"></script>
    <!-- preload.js -->
    <script src="%PUBLIC_URL%/corelibs/preload/preloadjs.min.js"></script>
    <!-- Preloader animation CSS -->
    <link href="%PUBLIC_URL%/preloader-animation.css" rel="stylesheet" type="text/css">
    <!-- Wait overlay CSS -->
    <link href="%PUBLIC_URL%/wait-overlay.css" rel="stylesheet" type="text/css">


    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>BUG Editor</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0px;
      }
      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 400;
        src: url('%PUBLIC_URL%/fonts/Nunito Sans/Nunito Sans_regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'PT Mono';
        font-style: normal;
        font-weight: 400;
        src: url('%PUBLIC_URL%/fonts/PT Mono/PTM55FT.ttf') format('truetype');
      }
    </style>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <div id="preloader">
      <div class="flashy">
        <img src="%PUBLIC_URL%/logo_bug2.svg" style="width: 100%; height: 100%;" />
      </div>
      <div class="flashy-shadow">
        <svg viewBox="0 0 100 50" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
            <ellipse cx="50" cy="25" rx="40" ry="10" style="fill:#09C399;" />
        </svg>
      </div>
      <div class="text">
        <svg viewBox="0 0 400 30" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
            <style>
                .small {
                    font: bold 26px Nunito;
                    fill: white;
                }
            </style>
            <text x="200" y="22" text-anchor="middle" class="small">BUG Editor</text>
        </svg>
      </div>
    </div>
    <div id="wait-overlay">
      Please wait...
    </div>
  </body>
</html>
